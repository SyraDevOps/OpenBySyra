<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyraEcho PT-BR</title><style>body{margin:0;background:#061d1c;color:#effffb;font:16px Arial;padding:32px}main{max-width:900px;margin:auto}.tag{color:#7cf5d7;letter-spacing:4px;font-weight:700;font-size:12px}h1{font-size:56px;margin:10px 0}.card{background:#0a2926;border:1px solid #258d7b;border-radius:18px;padding:24px}canvas{width:100%;height:180px;background:#061d1c;border-radius:12px}button{background:#7cf5d7;border:0;padding:13px 18px;border-radius:9px;font-weight:800;cursor:pointer;color:#06332d}pre{white-space:pre-wrap;color:#b4d4cc;min-height:90px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #258d7b;background:#061d1c;color:white;margin:15px 0}</style><body><main><div class="tag">OPENBYSYRA / DEMO 01</div><h1>SyraEcho <span style="color:#7cf5d7">PT-BR</span></h1><p>Fale e receba a transcrição em português, com palavras-chave destacadas.</p><section class="card"><button id="go">Iniciar microfone</button><input id="words" value="olá, syra, tecnologia"><canvas id="wave"></canvas><pre id="out">Aguardando voz…</pre></section></main><script src="./SyraEcho.js"></script><script>const out=document.querySelector('#out'),go=document.querySelector('#go'),echo=new SyraEcho({lang:'pt-BR',canvas:document.querySelector('#wave'),targetWords:['olá','syra','tecnologia'],onResult:r=>out.textContent=`${r.final?'Final':'Ouvindo'}: ${r.text}\nPalavras encontradas: ${r.matches.join(', ')||'—'}`,onStatus:s=>go.textContent=s==='listening'?'Parar':'Iniciar microfone'});go.onclick=()=>echo.active?echo.stop():(echo.setTargetWords(document.querySelector('#words').value),echo.start());</script></body></html>
