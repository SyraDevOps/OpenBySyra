<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyraVisionHands — Demo</title><style>body{margin:0;background:#1b1203;color:#fffbed;font:16px Arial;padding:30px}main{max-width:1100px;margin:auto}.tag{color:#fde68a;letter-spacing:4px;font-size:12px;font-weight:bold}h1{font-size:58px;margin:9px 0}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:22px}.stage{position:relative;aspect-ratio:16/9;background:#120c02;border:1px solid #b45309;border-radius:18px;overflow:hidden}.stage video,.stage canvas{position:absolute;width:100%;height:100%;object-fit:cover}.stage video{opacity:0}.panel{padding:22px;background:#332208;border:1px solid #b45309;border-radius:18px}button{background:#fde68a;border:0;border-radius:9px;padding:13px 18px;color:#543400;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;background:#120c02;padding:15px;border-radius:10px;color:#fef3c7;min-height:270px;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><body><main><div class="tag">OPENBYSYRA / HAND TRACKING</div><h1>SyraVisionHands</h1><p>Coordenadas das mãos e distância entre polegar e indicador.</p><section class="grid"><div class="stage"><video id="v" playsinline></video><canvas id="c"></canvas></div><aside class="panel"><button id="b">Iniciar câmera</button><pre id="o">Aguardando câmera…</pre></aside></section></main><script src="./SyraVisionHands.js"></script><script>const b=document.querySelector('#b'),o=document.querySelector('#o'),hands=new SyraVisionHands({video:document.querySelector('#v'),canvas:document.querySelector('#c'),onResults:r=>o.textContent=r.hands.length?r.hands.map(h=>`${h.handedness}\nDistância pinça: ${h.pinchDistance.toFixed(1)} px\nPolegar: ${JSON.stringify(h.thumbTip)}\nIndicador: ${JSON.stringify(h.indexTip)}`).join('\n\n'):'Nenhuma mão detectada.'});let on=false;b.onclick=async()=>{if(on){hands.stop();on=false;b.textContent='Iniciar câmera'}else{await hands.start();on=true;b.textContent='Parar câmera'}}</script></body></html>
