<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyraIris — Demo</title><style>body{margin:0;background:#260711;color:#fff5f7;font:16px Arial;padding:30px}main{max-width:1100px;margin:auto}.tag{color:#fda4af;letter-spacing:4px;font-size:12px;font-weight:bold}h1{font-size:58px;margin:9px 0}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:22px}.stage{position:relative;aspect-ratio:16/9;background:#19040b;border:1px solid #9f1239;border-radius:18px;overflow:hidden}.stage video,.stage canvas{position:absolute;width:100%;height:100%;object-fit:cover}.stage video{opacity:0}.panel{padding:22px;background:#3b0a18;border:1px solid #9f1239;border-radius:18px}button{background:#fda4af;border:0;border-radius:9px;padding:13px 18px;color:#500719;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;background:#19040b;padding:15px;border-radius:10px;color:#fecdd3;min-height:270px;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><body><main><div class="tag">OPENBYSYRA / IRIS TRACKING</div><h1>SyraIris</h1><p>Coordenadas da íris e métricas de olhar, pela câmera do navegador.</p><section class="grid"><div class="stage"><video id="v" playsinline></video><canvas id="c"></canvas></div><aside class="panel"><button id="b">Iniciar câmera</button><pre id="o">Aguardando câmera…</pre></aside></section></main><script src="./SyraIris.js"></script><script>const b=document.querySelector('#b'),o=document.querySelector('#o'),iris=new SyraIris({video:document.querySelector('#v'),canvas:document.querySelector('#c'),onResults:r=>o.textContent=r.detected?JSON.stringify(r.metrics,null,2)+'\n\nÍris esquerda:\n'+JSON.stringify(r.leftIris,null,2):'Procurando olhos…'});let on=false;b.onclick=async()=>{if(on){iris.stop();on=false;b.textContent='Iniciar câmera'}else{await iris.start();on=true;b.textContent='Parar câmera'}}</script></body></html>
