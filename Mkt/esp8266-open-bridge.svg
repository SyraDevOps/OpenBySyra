<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Open-Bridge-Syra para ESP8266</title>
  <desc id="desc">Peça para Instagram da SyraDevOps com ilustração vetorial de um ESP8266.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061d1c"/>
      <stop offset="1" stop-color="#031010"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
